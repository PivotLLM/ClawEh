version: "2"

linters:
  default: all
  disable:
    # TODO: Tweak for current project needs
    - containedctx
    - cyclop
    - depguard
    - dupword
    - gomodguard
    - err113
    - exhaustruct
    - exhaustruct_v5
    - funcorder
    - gochecknoglobals
    - godot
    - intrange
    - ireturn
    - nlreturn
    - noctx
    - noinlineerr
    - nonamedreturns
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5

    # Deferred deliberately, with reasons. Re-enabling any of these is a
    # project rather than a cleanup:
    #
    # gocyclo: 36 functions exceed the threshold, topped by
    #   (*AgentLoop).runLLMIteration at complexity 135. Refactoring those is a
    #   behavioural change to the agent loop, not a lint fix.
    # revive: configured enable-all-rules below, which yields ~1970 hits. Needs
    #   a curated rule set before it is useful.
    # goconst (1497) / mnd (340) / lll (198) / paralleltest (2460): high-volume
    #   style opinions the project has not adopted.
    # gochecknoinits: every hit is a channel's init.go self-registering with the
    #   channel registry (plus logger). That is the plugin pattern the package
    #   layout is built on; removing it means reworking channel registration.
    # nilnil: the production hits would each need a new sentinel error, which is
    #   an API change per call site, not a cleanup.
    # unparam: mostly test helpers with deliberately uniform signatures, plus
    #   always-nil error returns kept for interface symmetry. Worth a pass, but
    #   it changes function signatures, so not alongside a config change.
    - gochecknoinits
    - nilnil
    - unparam
    - contextcheck
    - embeddedstructfieldcheck
    - forbidigo
    - funlen
    - gocognit
    - goconst
    - gocyclo
    - godox
    - lll
    - maintidx
    - mnd
    - nestif
    - paralleltest
    - revive
    - tagalign
    - testifylint
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 120
      statements: 40
    gocognit:
      min-complexity: 25
    gocritic:
      disabled-checks:
        # Style-only, and Go's own stdlib uses if/else chains freely. Rewriting
        # 14 of them would be churn without changing behaviour; the checks that
        # find real problems (badCall, appendAssign, exitAfterDefer, …) stay on.
        - ifElseChain
        - elseif
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        # G104 (unhandled errors) is the same check as errcheck; one linter
        # is enough for it.
        - G104
        # G301/G302/G306 want 0750/0600 on every directory and file. ClawEh's
        # modes are deliberate: workspaces, config, logs and media are read by
        # the user, editors and other tools, and the pid file by `claw status`
        # possibly under another account. Private material (tokens, secrets)
        # is already written 0600. Decision, not a deferral.
        - G301
        - G302
        - G306
    govet:
      enable-all: true
      disable:
        - fieldalignment
    lll:
      line-length: 120
      tab-width: 4
    modernize:
      # omitzero on nested struct fields would start omitting zero-valued
      # sections from saved config.json and the status API; omitempty is a
      # no-op there today and that output is a contract.
      disable:
        - omitzero
    misspell:
      # No locale. Canadian English takes British -our/-re ("behaviour",
      # "centre") but American -ize ("synthesized"), so neither US nor UK fits:
      # US flagged 111 Commonwealth spellings, UK flagged 416 -ize endings.
      # Unset, misspell reports only unambiguous typos, which is what we want.
      locale: ""
    mnd:
      checks:
        - argument
        - assign
        - case
        - condition
        - operation
        - return
    nakedret:
      max-func-lines: 3
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          arguments:
            - 7
          severity: warning
        - name: banned-characters
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: comment-spacings
          arguments:
            - nolint
          severity: warning
        - name: cyclomatic
          disabled: true
        - name: file-header
          disabled: true
        - name: function-result-limit
          arguments:
            - 3
          severity: warning
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: modifies-value-receiver
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-receiver
          disabled: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - funlen
          - maintidx
          - gocognit
          - gocyclo
        path: _test\.go$
      # Tests read their own fixtures, run fixed commands and use fake keys;
      # gosec on them is noise that would need a directive per line.
      - linters:
          - gosec
        path: _test\.go$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
