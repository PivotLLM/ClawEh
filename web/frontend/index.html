<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The server fills in the product names when it serves this page
         (web/backend/embed.go); the frontend reads them from the meta tags
         (src/store/product.ts). Under the Vite dev server they stay as
         placeholders and the names come from /api/auth/status. -->
    <meta name="product-name" content="{{PRODUCT_NAME}}" />
    <meta name="product-short-name" content="{{PRODUCT_SHORT_NAME}}" />
    <meta name="product-binary-name" content="{{PRODUCT_BINARY_NAME}}" />
    <title>{{PRODUCT_NAME}}</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
